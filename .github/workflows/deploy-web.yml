name: "Deploy: Web"

on:
  # Production deploys on main are started by deploy-affected-workspaces.yml.
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - 'applications/web/**'
      - 'packages/**'

concurrency:
  group: deploy-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Quality check
    # A label event deploys only when the label itself is /deploy:preview, so
    # adding an unrelated label does not redeploy and post another comment.
    if: >-
      github.event_name != 'pull_request'
      || (
        contains(github.event.pull_request.labels.*.name, '/deploy:preview')
        && (github.event.action != 'labeled' || github.event.label.name == '/deploy:preview')
      )
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @audio-underview/web typecheck

      - name: Lint
        run: pnpm --filter @audio-underview/web lint

  deploy:
    runs-on: ubuntu-latest
    needs: quality
    name: Deploy to Cloudflare Pages
    if: >-
      github.event_name != 'pull_request'
      || (
        contains(github.event.pull_request.labels.*.name, '/deploy:preview')
        && (github.event.action != 'labeled' || github.event.label.name == '/deploy:preview')
      )
    permissions:
      contents: read
      deployments: write
      statuses: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter @audio-underview/web build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_WORKER_URL: ${{ vars.VITE_GOOGLE_OAUTH_WORKER_URL }}
          VITE_GITHUB_OAUTH_WORKER_URL: ${{ vars.VITE_GITHUB_OAUTH_WORKER_URL }}
          VITE_CRAWLER_CODE_RUNNER_FUNCTION_URL: ${{ vars.VITE_CRAWLER_CODE_RUNNER_FUNCTION_URL }}
          VITE_CRAWLER_MANAGER_WORKER_URL: ${{ vars.VITE_CRAWLER_MANAGER_WORKER_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./applications/web/outputs --project-name=audio-underview --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Set deployment status on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentURL = '${{ steps.deploy.outputs.deployment-url }}';
            const success = '${{ steps.deploy.outcome }}' === 'success';
            // On a pull request, context.sha is the temporary merge commit,
            // which the pull request's checks list never shows.
            const sha = context.payload.pull_request?.head.sha ?? context.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: success ? 'success' : 'failure',
              target_url: success ? deploymentURL : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              context: 'Cloudflare Pages',
              description: success ? deploymentURL : 'Deployment failed',
            });

      # A new comment on every deploy, so each commit's preview URL stays in
      # the pull request conversation.
      - name: Comment preview URLs on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Web preview"
            echo
            if [ -n "$BRANCH_URL" ]; then
              echo "- Branch (follows the latest deploy): $BRANCH_URL"
            fi
            echo "- This commit: $DEPLOYMENT_URL"
            echo
            echo "Commit: $HEAD_SHA"
          } > "$RUNNER_TEMP/preview-comment.md"
          gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/preview-comment.md"

      - name: Deployment summary
        if: success()
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ github.event_name == 'pull_request' && 'preview' || 'production' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy.outputs.deployment-url }} |" >> "$GITHUB_STEP_SUMMARY"
