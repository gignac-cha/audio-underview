name: "Deploy: Web"

# Cloudflare Pages 배포 (project: audio-underview).
# - PR: `/deploy:preview` label이 있을 때만 preview 환경으로 배포
# - push main: production 환경으로 배포
#
# 빌드 env(VITE_*)는 전부 repository variables. 새 단일 authentication-worker 구조에 맞춰
# 레거시의 provider별 worker URL을 authentication-worker 단일 URL로 통합했다.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'applications/web/**'
      - 'packages/**'
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
    paths:
      - 'applications/web/**'
      - 'packages/**'

concurrency:
  group: deploy-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # PR 이벤트는 `/deploy:preview` label 게이트 (push는 항상 실행)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, '/deploy:preview')
    runs-on: ubuntu-latest
    name: Typecheck and lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @audio-underview/web typecheck

      - name: Lint
        run: pnpm exec eslint --max-warnings 0 applications/web

  deploy:
    needs: quality
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, '/deploy:preview')
    runs-on: ubuntu-latest
    name: Build and deploy to Cloudflare Pages
    permissions:
      contents: read
      deployments: write
      statuses: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter @audio-underview/web build
        env:
          VITE_AUTHENTICATION_WORKER_URL: ${{ vars.VITE_AUTHENTICATION_WORKER_URL }}
          VITE_CRAWLER_MANAGER_WORKER_URL: ${{ vars.VITE_CRAWLER_MANAGER_WORKER_URL }}
          VITE_SCHEDULER_MANAGER_WORKER_URL: ${{ vars.VITE_SCHEDULER_MANAGER_WORKER_URL }}
          VITE_CRAWLER_CODE_RUNNER_FUNCTION_URL: ${{ vars.VITE_CRAWLER_CODE_RUNNER_FUNCTION_URL }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy ./applications/web/outputs
            --project-name=audio-underview
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Record deployment summary
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const environment = context.eventName === 'pull_request' ? 'preview' : 'production';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'Cloudflare Pages',
              target_url: url,
              description: `Deployed to ${environment}`,
            });
            await core.summary
              .addHeading('Cloudflare Pages Deployment')
              .addTable([
                [{ data: 'Environment', header: true }, { data: 'URL', header: true }],
                [environment, url],
              ])
              .write();
