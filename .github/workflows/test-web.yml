name: "Test: Web"

on:
  pull_request:
    branches: [main]
    paths:
      - 'applications/web/**'
      - 'packages/**'
      - '.github/workflows/test-web.yml'

concurrency:
  group: test-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run web unit tests
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @audio-underview/web typecheck

      # ESLint flat config는 root 단일 구성 (documents/architecture.md §8)
      - name: Lint
        run: pnpm exec eslint --max-warnings 0 applications/web

      # web 테스트는 jsdom 기반 — 브라우저 설치 불필요
      - name: Run web tests
        run: pnpm --filter @audio-underview/web test
