name: "Deploy: Authentication Worker"

# 단일 authentication-worker가 OAuth provider 10개를 전부 서비스한다 (ADR-1).
# 레거시의 provider별 worker 8개 배포(deploy-oauth-workers.yml)를 대체.
#
# GitHub secret 이름 주의:
# - GITHUB_ prefix는 GitHub Actions 예약어라 GitHub provider credential은
#   OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET 이름으로 등록한다.
#   (worker에 주입되는 secret 이름은 GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET)
# - 레거시에서 vars였던 GOOGLE_CLIENT_ID / OAUTH_GITHUB_CLIENT_ID는
#   일관성을 위해 전부 secrets로 통일 — 마이그레이션 시 secrets에 재등록 필요.
# - KAKAO_CLIENT_SECRET은 provider 설정상 optional이지만 wrangler-action의
#   secrets: 입력은 빈 값을 허용하지 않으므로 값(또는 placeholder)을 등록해 둘 것.

on:
  workflow_dispatch:

jobs:
  deploy-authentication:
    runs-on: ubuntu-latest
    name: Deploy Authentication Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/authentication-worker
          command: deploy
          secrets: |
            JWT_SECRET
            SUPABASE_URL
            SUPABASE_SECRET_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            APPLE_CLIENT_ID
            APPLE_TEAM_ID
            APPLE_KEY_ID
            APPLE_PRIVATE_KEY
            MICROSOFT_CLIENT_ID
            MICROSOFT_CLIENT_SECRET
            FACEBOOK_CLIENT_ID
            FACEBOOK_CLIENT_SECRET
            GITHUB_CLIENT_ID
            GITHUB_CLIENT_SECRET
            DISCORD_CLIENT_ID
            DISCORD_CLIENT_SECRET
            KAKAO_CLIENT_ID
            KAKAO_CLIENT_SECRET
            NAVER_CLIENT_ID
            NAVER_CLIENT_SECRET
            LINKEDIN_CLIENT_ID
            LINKEDIN_CLIENT_SECRET
            X_CLIENT_ID
            X_CLIENT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
