name: "Test: Share Viewer"

on:
  pull_request:
    branches: [main]
    paths:
      - 'applications/share-viewer/**'
      - 'packages/**'
      - '.github/workflows/test-share-viewer.yml'

concurrency:
  group: test-share-viewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run share viewer tests
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checks the application and the Pages Function against their own tsconfig files.
      - name: Typecheck
        run: pnpm --filter @audio-underview/share-viewer typecheck

      - name: Run share viewer tests
        run: pnpm --filter @audio-underview/share-viewer exec vitest run --reporter=default --reporter=junit --outputFile.junit=test-results.xml

      - name: Test report
        uses: mikepenz/action-junit-report@v5
        if: success() || failure()
        with:
          check_name: Share Viewer Test Results
          report_paths: 'applications/share-viewer/test-results.xml'
