name: "Deploy: Crawler Function"

# crawler-code-runner-function (AWS Lambda) 배포.
# 레거시 deploy-crawler-functions.yml 대체 — 배포 비활성이던 CF worker 경로 삭제 (ADR-2).
# 재작성에서 Bearer JWT 검증이 추가되어 Lambda 환경변수에 JWT_SECRET이 필요하다
# (workers와 동일한 secret — GitHub secret JWT_SECRET 재사용).

on:
  workflow_dispatch:

jobs:
  deploy-crawler-code-runner:
    runs-on: ubuntu-latest
    name: Deploy Crawler Code Runner Function
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build function
        run: pnpm --filter @audio-underview/crawler-code-runner-function build

      - name: Package function
        working-directory: functions/crawler-code-runner-function/outputs
        run: zip function.zip index.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check if function exists
        id: check-function
        run: |
          if aws lambda get-function --function-name audio-underview-crawler-code-runner-function 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create function
        if: steps.check-function.outputs.exists == 'false'
        run: |
          aws lambda create-function \
            --function-name audio-underview-crawler-code-runner-function \
            --runtime nodejs24.x \
            --handler index.handler \
            --timeout 30 \
            --memory-size 256 \
            --role ${{ secrets.AWS_LAMBDA_EXECUTION_ROLE_ARN }} \
            --zip-file fileb://functions/crawler-code-runner-function/outputs/function.zip \
            --environment '{"Variables":{"ALLOWED_ORIGINS":"${{ vars.ALLOWED_ORIGINS }}","JWT_SECRET":"${{ secrets.JWT_SECRET }}"}}'

      - name: Update function code
        if: steps.check-function.outputs.exists == 'true'
        run: |
          aws lambda update-function-code \
            --function-name audio-underview-crawler-code-runner-function \
            --zip-file fileb://functions/crawler-code-runner-function/outputs/function.zip

      - name: Wait for function update
        if: steps.check-function.outputs.exists == 'true'
        run: |
          aws lambda wait function-updated-v2 \
            --function-name audio-underview-crawler-code-runner-function

      - name: Update function configuration
        if: steps.check-function.outputs.exists == 'true'
        run: |
          aws lambda update-function-configuration \
            --function-name audio-underview-crawler-code-runner-function \
            --runtime nodejs24.x \
            --handler index.handler \
            --timeout 30 \
            --memory-size 256 \
            --environment '{"Variables":{"ALLOWED_ORIGINS":"${{ vars.ALLOWED_ORIGINS }}","JWT_SECRET":"${{ secrets.JWT_SECRET }}"}}'
