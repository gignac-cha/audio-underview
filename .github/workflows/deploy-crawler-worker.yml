name: "Deploy: Crawler Worker"

# crawler-manager-worker 배포.
# worker secret(SUPABASE_URL, SUPABASE_SECRET_KEY, JWT_SECRET, CODE_RUNNER_FUNCTION_URL)은
# 레거시와 동일하게 CI 밖에서 수동 관리 (`wrangler secret put`, 소스: <root>/.env.workers).

on:
  workflow_dispatch:

jobs:
  deploy-crawler-manager:
    runs-on: ubuntu-latest
    name: Deploy Crawler Manager Worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/crawler-manager-worker
          command: deploy
