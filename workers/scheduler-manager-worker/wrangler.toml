name = "audio-underview-scheduler-manager-worker"
main = "sources/index.ts"
compatibility_date = "2025-11-25"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://audio-underview.pages.dev"

# Secrets (set via wrangler secret put):
# SUPABASE_URL
# SUPABASE_SECRET_KEY
# JWT_SECRET

[[services]]
binding = "CRAWLER_MANAGER"
service = "audio-underview-crawler-manager-worker"

# The tick that starts scheduled runs that are due
[triggers]
crons = ["*/10 * * * *"]

# One instance runs one scheduled occurrence, or one manual run of a scheduler that has a task group stage
[[workflows]]
name = "audio-underview-scheduler-run-workflow"
binding = "SCHEDULER_RUN_WORKFLOW"
class_name = "SchedulerRunWorkflow"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
