# supabase-js calls the Data API at <SUPABASE_URL>/rest/v1/..., while PostgREST serves from its root.
# The gateway takes the place of the Supabase API URL: it strips /rest/v1 and hands the request to
# the rest service.
server {
  listen 8000;

  # Requests carry crawler results, which can be larger than the default limit of 1 MB
  client_max_body_size 50m;

  # Docker's embedded DNS server. Resolving per request keeps the gateway working after the rest
  # container is recreated with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /rest/v1/ {
    set $rest_upstream http://rest:3000;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass $rest_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    return 404;
  }
}
